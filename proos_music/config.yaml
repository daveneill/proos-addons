name: ProOS Music
version: "2.9.11"
slug: proos_music
description: >-
  OPTIONAL cross-brand speaker grouping (Music Assistant). Adds the ability to
  sync DIFFERENT speaker brands together (e.g. Sonos + HomePod). It does NOT
  provide Sonos/HEOS favourites, and it can desync if a client controls the
  speakers from the native Sonos/HEOS app. Native Sonos/HEOS are the ProOS
  standard — only add this where cross-brand grouping is genuinely required.
  Read the Documentation tab before installing.
url: https://github.com/daveneill/proos-addons/tree/main/proos_music
arch:
  - amd64
  - aarch64
image: ghcr.io/music-assistant/server
homeassistant_api: true
discovery:
  - music_assistant
auth_api: true
host_network: true
ingress: true
ingress_port: 8094
panel_icon: mdi:music
panel_title: ProOS Music
panel_admin: false
apparmor: true
map:
  - media:rw
  - ssl:ro
init: false
backup_exclude:
  - cache.db
  - collage_images/*
  - .cache/*
stage: stable
tmpfs: true
options:
  log_level: info
  safe_mode: false
schema:
  log_level: list(debug|info|warning|error)
  safe_mode: bool
privileged:
  - SYS_ADMIN
