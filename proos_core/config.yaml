name: ProOS Core
version: "0.3.0"
slug: proos_core
description: >-
  The operational layer above Home Assistant — state-based room control,
  monitoring, and self-healing. The dashboard talks to this.
url: "https://github.com/protechsystems/proos-core"
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false
# Grants a Supervisor token + a proxy to HA core at http://supervisor/core,
# so Core needs no manually-created long-lived token.
homeassistant_api: true
# The dashboard reaches Core's API on this port.
ports:
  "8770/tcp": 8770
ports_description:
  "8770/tcp": ProOS Core API (the dashboard connects here)
options:
  home_id: dave-family-home
  area: Family Room
  monitor_interval: 20
  auto_heal: false
  reachability:
    - entity: media_player.family_room_apple_tv
      sensor: binary_sensor.192_168_1_110
schema:
  home_id: str
  area: str
  monitor_interval: int(5,3600)
  auto_heal: bool
  reachability:
    - entity: str
      sensor: str?
      ip: str?
