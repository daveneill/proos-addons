name: ProOS Core
version: "1.0.535"
slug: proos_core
description: >-
  The operational layer above Home Assistant — state-based room control,
  monitoring, and self-healing. The dashboard talks to this.
url: "https://github.com/protechsystems/proos-core"
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false
# Grants a Supervisor token + a proxy to HA core at http://supervisor/core,
# so Core needs no manually-created long-lived token.
homeassistant_api: true
# Reset (restore the proos-baseline backup) needs Supervisor backup/restore access.
# admin (was manager): GET /discovery — the source of truth for the ProOS Music
# token — returns 401 to manager-role add-ons (observed live 2026-07-24).
hassio_api: true
hassio_role: admin
# Write off-device backup copies to a /share subfolder (a NAS/USB mounted in HA).
# Read/write access to HA's config dir lets Core read the Music server token HA
# already stored for its own integration (so commissioning needs no separate
# login), and white-label the HomeKit bridge name in the config-entries store
# (HA's API can't rename a bridge — see _homekit_brand / POST /homekit/brand).
map:
  # Tech-Tools terminal parity with HA's Terminal & SSH add-on: mount the same
  # filesystem tree so file paths resolve identically (incl. the /config path HA
  # users reach for out of habit, not just /homeassistant). Not a privileged
  # container — host/Docker access is still the one thing only the SSH add-on has.
  - homeassistant_config:rw
  - config:rw
  - ssl:rw
  - addons:rw
  - all_addon_configs:rw
  - backup:rw
  - share:rw
  - media:rw
# A1/A2 PHASE 2 (23 Aug 2026, reg 268): Core joins HA's own front door.
# The Supervisor proxies /api/hassio_ingress/<token>/* straight to this
# port; the apps served at /app/* call Core through the same door they
# loaded from (see _proosSelfBase in both apps). The sidebar entry is
# back-of-house furniture — admin-only; homeowners open their pinned app
# icon and never see it. The direct port below STAYS OPEN through Phase 2
# (both doors side by side); it closes in Phase 3, on Dave's own go,
# after the pinned-iPad test has been lived with.
ingress: true
ingress_port: 8770
panel_icon: mdi:home-circle
panel_title: ProOS
panel_admin: true
# The dashboard reaches Core's API on this port.
ports:
  "8770/tcp": 8770
ports_description:
  "8770/tcp": ProOS Core API (the dashboard connects here)
options:
  # Shipped defaults contain NO home (Stage 5 build 1, 16 Aug 2026):
  # home_id names THIS box and is set at commissioning; the old default
  # carried the author's own home id into every fresh install.
  home_id: home
  area: Family Room
  monitor_interval: 20
  auto_heal: false
  # Music Assistant is an optional, certified ProOS integration — off by
  # default. When false, Core never tries to commission or connect MA, so an
  # absent MA produces no boot retries and no errors. Enable it to use
  # cross-brand speaker grouping; Core then owns the music_assistant
  # integration and connects to the MA server on boot.
  music_assistant: false
  # Auto-backup: a daily encrypted backup, pruned to keep N, optionally copied
  # off-device. Leave auto_backup_copy_to empty for on-device only; point it at a
  # /share subfolder (a NAS/USB mounted in HA) to keep an off-device copy.
  auto_backup: true
  auto_backup_time: "03:30"
  auto_backup_full: true
  auto_backup_keep: 7
  auto_backup_copy_to: ""
  # Override the built-in white-label encryption key per fleet (masked in the UI).
  backup_password: ""
  # Protech servicing secret (masked). The hidden Developer/Owner account's
  # password is derived per-box from this secret + the box's hardware id, so
  # Protech can recompute it to service any box while a leak from one box never
  # opens the fleet. SET THIS before shipping — the build-time fallback is for
  # bench/dev boxes only and is NOT fleet-safe.
  owner_secret: ""
  # Default password the auto-created Installer login ships with; the installer
  # is forced to change it on first commission. Leave blank for the built-in
  # default (proos-install).
  installer_password: ""
  # Manual reachability witnesses (entity -> its liveness sensor). Ships
  # EMPTY: the identity-joined auto-harvest finds witnesses per box, and
  # installers commit manual rows here or in Pro. The old default shipped
  # an example row naming a real device and sensor from the author's own
  # house (Stage 5 build 1, 16 Aug 2026).
  reachability: []
  # Security / hardening — auth and consent enforcement ship ON
  # (Dave's rulings, 16 Aug 2026, Stage 0 of the rescue — pinned by
  # shipped_defaults_pin_bench.py):
  #   require_auth:    reject callers to Core's API (:8770) without a valid HA
  #                    token. ON: a mis-setup fails loudly instead of silently
  #                    serving the house's data. auth/login stays public so an
  #                    armed fresh box still bootstraps.
  #   consent_enforce: the homeowner's consent switches actually activate or
  #                    deactivate installer/tech accounts, not just record
  #                    state. ON: a control that lies is worse than none. The
  #                    default grant leaves the installer active, so nobody is
  #                    locked out at commissioning; owner and homeowner
  #                    accounts are never touched by design.
  #   set_hostname:    allow first boot to rename the box proos-<id> (factory only).
  #   ha_direct:       override the HA core URL used to verify caller tokens,
  #                    e.g. http://192.168.1.240:8123 (leave blank for the default).
  require_auth: true
  consent_enforce: true
  set_hostname: false
  ha_direct: ""
  # Brandfetch Logo API client ID (free). Lets Tech Tools look app artwork
  # up by brand domain. Fetched once and stored on the box — dashboards
  # never call out to the internet for tiles. Blank = manual upload only.
  brandfetch_client_id: ""
  # Proactive notifications: when a device fault is CONFIRMED, tell the
  # household's phones in plain language, and again when it's back. One
  # notice per episode, quiet 22:00-07:00 (queued to morning; dropped if
  # it self-heals overnight). Uses the HA mobile app / ProOS app.
  proactive_notify: true
  # Publish each committed room's live activity verdict as
  # sensor.proos_activity_<area> (watch_apple_tv / watch_tv / off). One
  # trigger per room for overlaid control systems (Savant / Control4)
  # and HA automations — the same verdict the dashboards show.
  activity_sensors: true
  # Optional: a Savant (or other overlay) host IP to liveness-probe as
  # binary_sensor.proos_savant_host. Blank = off.
  savant_host: ""
  # Independent traffic witnesses for room verdicts (installer-committed):
  # "source_entity|rate_sensor1,rate_sensor2|min_rate;..." — a source whose
  # network throughput exceeds min is confirmed live even when its own
  # integration session has dropped (Apple TV Companion flakiness etc.).
  traffic_witnesses: ""
  # When an external controller (Savant/C4/TV remote) half-starts a room,
  # ProOS completes it through the room's generated watch script.
  # OFF BY DEFAULT since the product reset (2 Aug 2026): observe only.
  # Put-right is a deliberate per-site choice, never a reflex.
  intent_convergence: false
  # Standard placement: an unassigned weather entity is assigned to the
  # Home area automatically (journaled, movable in Pro). Off = leave
  # registry areas untouched.
  auto_home_weather: true
  # Awareness posture (product reset, 2 Aug 2026):
  #   activities — rooms claim COMMANDED activities, confirmed by power.
  #   monitor    — rooms publish only on/off + device truth; commands still
  #                fire scripts, the state never claims an activity. Devices
  #                may be added to rooms without being committed.
  awareness_mode: activities
schema:
  home_id: str
  area: str
  monitor_interval: int(5,3600)
  auto_heal: bool
  music_assistant: bool
  auto_backup: bool
  auto_backup_time: str
  auto_backup_full: bool
  auto_backup_keep: int(1,365)
  auto_backup_copy_to: str?
  backup_password: password?
  owner_secret: password?
  installer_password: str?
  reachability:
    - entity: str
      sensor: str?
      ip: str?
  require_auth: bool
  consent_enforce: bool
  set_hostname: bool
  ha_direct: str?
  brandfetch_client_id: str?
  proactive_notify: bool?
  activity_sensors: bool?
  savant_host: str?
  traffic_witnesses: str?
  intent_convergence: bool?
  awareness_mode: list(activities|monitor)?
  auto_home_weather: bool?
