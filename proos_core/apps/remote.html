<title>ProOS Remote</title>

  THE ProOS REMOTE'S SCREEN. Served by Core at /app/remote and shown full-screen by the ProOS Remote app on the Sanytron
  Astrion HA100A (480×800, density 220 → 349×582 CSS px).
  969j (20 Oct): first build. 969p (21 Oct): rebuilt to the approved showcase (claude.ai "ProOS × Sanytron Showcase",
  Dave 21 Oct 07:47 "build that into our Astrion interface") — the Savant Pro Remote's way of working:
    · the SCREEN IS TOUCH ONLY — three main screens swiped left/right (Favourites · Services · Scenes);
    · every page fills the screen edge to edge; no text explaining the hard keys;
    · the D-pad, OK, Back and Menu only ever control what's playing (decided by Core, remotes.resolve) — they never

<style>
:root{color-scheme:dark;--ink:#fff;--ink2:rgba(255,255,255,.7);--ink3:rgba(255,255,255,.45);--hair:rgba(255,255,255,.12);
--amber:#FFC46B;--blue:#5B8CFF;--mint:#5BE38F;--red:#ff8f8f;--ease:cubic-bezier(.2,.8,.2,1);
--f:'Inter',-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0b0e;color:var(--ink);font-family:var(--f);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#ph{position:fixed;top:-40px;left:-40px;right:-40px;bottom:-40px;background:#0b0b0e center/cover;z-index:-2;filter:blur(18px) brightness(.42) saturate(1.2);transition:opacity .5s}
#ph.warm{filter:blur(20px) brightness(.32) sepia(.3)}
#ph.deep{filter:blur(20px) brightness(.3)}
#ph.sharp{top:0;left:0;right:0;bottom:0;filter:brightness(.55)}
#ph.none{opacity:0}
#sh{position:fixed;top:0;left:0;right:0;bottom:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,.05) 40%,rgba(0,0,0,.45) 100%)}
#app{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none}
.hd{flex:none;height:54px;padding:10px 10px 0;display:flex;align-items:center;gap:10px}
.cb{width:34px;height:34px;border-radius:17px;flex:none;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center}
.cb.off{border-color:rgba(255,107,107,.35);background:rgba(255,90,90,.16);color:var(--red)}
.pill{height:34px;padding:0 14px;border-radius:17px;flex:none;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);font-size:12px;font-weight:600;display:flex;align-items:center}
.ctr{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.cap{font-size:11px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dts{display:flex;gap:5px}.dts i{width:5px;height:5px;border-radius:3px;background:rgba(255,255,255,.35);transition:width .3s var(--ease),background .3s}.dts i.on{width:14px;background:#fff}
.tm{width:34px;flex:none;text-align:center;font-size:12px;font-weight:500;color:rgba(255,255,255,.8)}
.tt{flex:1;min-width:0}.tt b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tt span{display:block;font-size:11px;color:var(--ink2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body{flex:1;min-height:0;padding:0 10px 10px;display:flex;flex-direction:column;gap:8px}
.scr{overflow-y:auto;scrollbar-width:none}.scr::-webkit-scrollbar{display:none}
.gl{position:relative;border-radius:24px;overflow:hidden;background:rgba(255,255,255,.06);border:1px solid var(--hair)}
.gl.act{background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border-color:rgba(255,255,255,.22);box-shadow:0 18px 40px rgba(0,0,0,.45)}
.fill{flex:1;min-height:0}
.cen{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:0 14px}
.t1{font-size:16px;font-weight:600;letter-spacing:-.2px}.t2{font-size:12px;color:var(--ink2);margin-top:3px}
.glow{position:absolute;left:50%;top:44%;width:190px;height:190px;margin:-95px 0 0 -95px;border-radius:50%;pointer-events:none}
.ldot{position:absolute;left:16px;top:16px;width:8px;height:8px;border-radius:4px;background:var(--mint);box-shadow:0 0 10px var(--mint)}
.bar{height:3px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}.bar i{display:block;height:100%;background:#fff;border-radius:2px}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:10px;margin-right:4px}.eq i{width:2.5px;background:var(--mint);border-radius:1px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.35s}.eq i:nth-child(3){animation-delay:-.7s}@keyframes eq{0%,100%{height:3px}50%{height:10px}}
#pager{flex:none;height:100%;display:flex;width:300%;transition:transform .38s var(--ease)}
#pager.drag{transition:none}
.pane{width:33.3333%;height:100%;display:flex;flex-direction:column;padding:0 10px 10px;gap:8px}
.fav{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.fv{width:calc(50% - 4px);position:relative;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.08);box-shadow:0 6px 16px rgba(0,0,0,.5)}
.fv:before{content:"";display:block;padding-top:60%}
.fv img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.fv span{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;padding:0 8px;text-align:center}
.ph{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.shd{position:absolute;top:0;left:0;right:0;bottom:0}
.empty{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ink2);font-size:13px;line-height:1.5;padding:20px}
.row{position:relative;flex:1;min-height:58px;border-radius:22px;overflow:hidden;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);touch-action:none}
.row .lv{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#F5A443,#FFD38A);box-shadow:0 0 40px rgba(255,196,107,.4)}
.row .hn{position:absolute;top:50%;width:4px;height:34px;margin:-17px 0 0 -12px;border-radius:2px;background:rgba(255,255,255,.95)}
.row .nm{position:absolute;left:16px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:2px}
.row .nm b{font-size:15px;font-weight:600}.row .nm span{font-size:11px;opacity:.75}
.row .vv{position:absolute;right:18px;top:0;bottom:0;display:flex;align-items:center;font-size:22px;font-weight:300}
.row .vv.o{font-size:15px;color:var(--ink2)}
.row.lit .nm{color:#2a1800}
.seg{flex:none;height:56px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);display:flex;gap:4px;padding:4px}
.seg div{flex:1;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink2)}
.seg div.on{background:var(--blue);color:#fff;font-weight:600}.seg.w div.on{background:rgba(255,255,255,.18)}
.vol{flex:none;position:relative;height:46px;border-radius:23px;overflow:hidden;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);touch-action:none}
.vol i{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.92)}
.vol .l{position:absolute;left:16px;top:0;bottom:0;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#111114;mix-blend-mode:normal}
.vol .r{position:absolute;right:16px;top:0;bottom:0;display:flex;align-items:center;font-size:13px;font-weight:600}
.tp{position:relative;flex:1;min-height:0;border-radius:28px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.12);touch-action:none}
.ring{position:absolute;left:50%;top:44%;border-radius:50%;pointer-events:none}
.tr{display:flex;align-items:center;justify-content:center;gap:26px}
.rb{width:46px;height:46px;border-radius:23px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center}
.pb{width:64px;height:64px;border-radius:32px;background:#fff;color:#0b0b0e;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.btns{flex:none;display:flex;gap:8px}.btns div{flex:1;height:44px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500}
.big2{display:flex;gap:8px;flex:none;height:96px}.big2 div{flex:1;border-radius:24px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center}
.hud{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.94);z-index:9;width:200px;padding:18px 16px;border-radius:24px;text-align:center;background:rgba(18,18,22,.86);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--hair);opacity:0;pointer-events:none;transition:opacity .25s,transform .35s var(--ease)}
.hud.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#dim{position:fixed;top:0;left:0;right:0;bottom:0;z-index:8;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s}#dim.on{opacity:1}
.toast{position:fixed;left:12px;right:12px;bottom:16px;z-index:7;padding:12px;display:flex;align-items:center;gap:11px;transform:translateY(20px);opacity:0;transition:all .4s var(--ease);border-radius:18px;background:rgba(24,24,30,.9);border:1px solid var(--hair)}
.toast.on{transform:none;opacity:1}
.okc{width:28px;height:28px;border-radius:50%;background:#32D74B;display:flex;align-items:center;justify-content:center;color:#032;flex:none;box-shadow:0 0 18px rgba(50,215,75,.6);font-weight:800}
.okc.bad{background:var(--amber);box-shadow:0 0 18px rgba(255,180,90,.6)}
.orb{width:132px;height:132px;border-radius:50%;position:relative;background:radial-gradient(circle at 38% 32%,#b9c4ff,#5b6cff 40%,#2139F0 62%,#0a1680);box-shadow:0 0 60px rgba(60,90,255,.6)}
.orb:before,.orb:after{content:"";position:absolute;top:-14px;left:-14px;right:-14px;bottom:-14px;border-radius:50%;border:2px solid rgba(120,140,255,.45);animation:wave 2s ease-out infinite}.orb:after{animation-delay:1s}
@keyframes wave{from{transform:scale(.9);opacity:.9}to{transform:scale(1.5);opacity:0}}
.orb.think{animation:breathe 1.2s ease-in-out infinite}@keyframes breathe{50%{transform:scale(.92)}}
.dots{display:inline-flex;gap:5px}.dots i{width:7px;height:7px;border-radius:50%;background:#5b8cff;animation:dt 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dt{0%,100%{opacity:.25}50%{opacity:1}}
.press{transition:transform .12s}.press:active{transform:scale(.97)}

function img(src, cls, alt) { return src ? '<img class="'+(cls||'ph')+'" src="'+esc(src)+'" alt="'+esc(alt||'')+'" onerror="this.style.display=\'none\'">' : ''; }
function photoUrl(u) {   // a scene photo kept on the platform (/local/…) is served by the platform, not Core
  if (!u) return '';
  if (u.charAt(0) === '/' && u.indexOf('/local/') === 0) return location.protocol + '//' + location.hostname + ':8123' + u;
  return u;
}
const roomPhoto = a => '/remote/photo/' + encodeURIComponent(a) + '?' + tq();
const artUrl = e => '/remote/art?e=' + encodeURIComponent(e) + '&' + tq();
const clock = () => new Date().toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'}).replace(/\s?[AP]M/i, '');
function cap(s) { return String(s || '').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()); }
function posPct(o) {
  if (!o || !o.duration || o.position == null) return null;
  const live = o.state === 'playing' || o.state == null ? (o.updated ? (Date.now() - Date.parse(o.updated)) / 1000 : 0) : 0;
  return Math.max(0, Math.min(100, Math.round((o.position + live) / o.duration * 100)));
}
function minsLeft(o) { if (!o || !o.duration || o.position == null) return null; return Math.max(0, Math.round((o.duration - o.position) / 60)); }

function setPhoto(mode) {
  const ph = $('#ph');
  const want = AREA && ST && ST.photo ? roomPhoto(AREA) : '';
  if (ph.dataset.u !== want) { ph.dataset.u = want; ph.style.backgroundImage = want ? 'url("' + want + '")' : 'none'; }
  ph.className = mode || '';
}

function svcTiles() {
  const t = [];
  const w = ST.watching, m = ST.music, ls = ST.lights || [], cl = ST.climate, cv = ST.covers || [];
  const mOn = m && (m.state === 'playing' || m.state === 'paused') && m.title;
  // THE SERVICES SCREEN IS THE ROOM'S ACTIVITIES, ONE PRESS EACH (Dave, 21 Oct 08:29: "Activities are supposed to be on
  // the main page as one button presses like the Savant"). A tap starts the activity; the one running carries the dot
  // and its live programme, and a tap on it opens its controls. Lights, Climate and Shades have their own hard keys —
  // they appear here only in a room with no activities.
  // Display On is not an activity anyone starts from a remote (hidden since 969j); TV Off is the Power key.
  const acts = (ST.activities || []).filter(a => a.key !== 'tv_off' && a.kind !== 'tv_off' && a.kind !== 'display_on' && a.key !== 'display_on');
  // Which tile is running: Core's own join only (remotes._match_activity). The TV merely being on is not an activity,
  // and no tile is lit for it — nothing is guessed from a name.
  const isOn = a => !!a.on;
  const GENERIC = {tv:1, television:1, display:1, 'display on':1, music:1};
  if (acts.length) {
    acts.forEach(a0 => {
      const a = Object.assign({}, a0, {on: isOn(a0)});
      const nm = String(a.label || '').replace(/^(watch|listen to|play)\s+/i, '');
      const logo = '<div style="position:relative;width:112px;height:67px;border-radius:13px;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.5);background:rgba(255,255,255,.1)">' +
        '<div class="cen" style="padding:0">'+ic(a.kind === 'music' ? 'note' : 'tv', 30)+'</div>'+(GENERIC[nm.toLowerCase()] ? '' : img(TILE(nm), 'ph', nm))+'</div>';
      let sub = esc(a.kind === 'music' ? 'Music' : 'Watch'), bar = '';
      if (a.on && w && a.kind !== 'music') {
        const left = minsLeft(w), pct = posPct(w);
        sub = esc([w.title, left != null ? left + ' min left' : ''].filter(Boolean).join(' · ') || 'On Now');
        if (pct != null) bar = '<div class="bar" style="position:absolute;left:18px;right:18px;bottom:14px"><i style="width:'+pct+'%"></i></div>';
      } else if (a.on && mOn) sub = (m.state === 'playing' ? '<span class="eq"><i></i><i></i><i></i></span>' : '') + esc([m.title, m.artist].filter(Boolean).join(' · '));
      else if (a.on) sub = 'On Now';
      t.push('<div class="gl fill press'+(a.on?' act':'')+'" '+(a.on ? 'data-go="'+(a.kind === 'music' ? 'music' : 'watching')+'"' : 'data-act="'+esc(a.key)+'"')+' style="min-height:120px">' +
        (a.on ? '<div class="ldot"></div>' : '') + '<div class="cen">' + logo + '<div><div class="t1">'+esc(nm || a.label)+'</div><div class="t2">'+sub+'</div></div></div>' + bar + '</div>');
    });
    return t;
  }
  if (w) t.push('<div class="gl act fill press" data-go="watching" style="min-height:120px"><div class="ldot"></div><div class="cen">'+ic('tv',44,'#fff',1.5)+'<div><div class="t1">'+esc(w.title || w.label || 'Watching')+'</div></div></div></div>');
  if (ls.length) {
    const on = ls.filter(l => l.on), avg = on.length ? Math.round(on.reduce((a, l) => a + (l.brightness || 100), 0) / on.length) : 0;
    t.push('<div class="gl fill press" data-go="lights" style="min-height:110px">'+(on.length?'<div class="glow" style="background:radial-gradient(circle,rgba(255,196,107,.38) 0%,rgba(255,196,107,0) 65%)"></div>':'') +
      '<div class="cen">'+ic('bulb',46,on.length?'#FFC46B':'rgba(255,255,255,.75)',1.5)+'<div><div class="t1">Lights</div><div class="t2">'+(on.length?on.length+' of '+ls.length+' On · '+avg+'%':'All Off')+'</div></div>' +
      '<div style="display:flex;gap:6px">'+ls.slice(0, 8).map(l => '<div style="width:18px;height:4px;border-radius:2px;background:'+(l.on?'#FFC46B':'rgba(255,255,255,.2)')+'"></div>').join('')+'</div></div></div>');
  }
  if (cl) {
    const heat = cl.action === 'heating' || cl.mode === 'heat';
    t.push('<div class="gl fill press" data-go="climate" style="min-height:110px">'+(cl.mode!=='off'?'<div class="glow" style="top:50%;margin-top:-100px;width:200px;height:200px;margin-left:-100px;background:radial-gradient(circle,'+(heat?'rgba(255,150,90,.3)':'rgba(91,140,255,.32)')+' 0%,rgba(0,0,0,0) 65%)"></div>':'') +
      '<div class="cen" style="gap:4px"><div style="font-size:60px;font-weight:200;letter-spacing:-2px;line-height:1">'+(cl.mode==='off'?'Off':(cl.target!=null?cl.target+'°':'—'))+'</div>' +
      '<div class="t2" style="display:flex;align-items:center;gap:6px">'+(cl.mode!=='off'?ic(heat?'flame':'snow',13,heat?'#ffb08a':'#9db8ff'):'')+'<span>'+esc(cap(cl.action || cl.mode))+(cl.current!=null?' · Room '+cl.current+'°':'')+'</span></div></div></div>');
  }

      '<div><div class="t1">Music</div><div class="t2">'+esc(m.name || '')+'</div></div></div></div>');

}

  const ang = (135 + 270 * frac) * Math.PI / 180, kx = 132.5 + R * Math.cos(ang), ky = 132.5 + R * Math.sin(ang);
  const seg = (list, cur, attr, wide) => list && list.length ? '<div class="seg'+(wide?' w':'')+'">' + list.slice(0, 5).map(m => '<div class="press'+(m === cur ? ' on' : '')+'" data-'+attr+'="'+esc(m)+'">'+esc(cap(m))+'</div>').join('') + '</div>' : '';
  return hdPage('Climate', esc(ST.name + ' · ' + cap(c.action || c.mode)), '', '<button class="cb'+(off?'':' off')+' press" data-climpwr="1" aria-label="'+(off?'Turn On':'Turn Off')+'">'+ic('pwr',15,null,2.2)+'</button>') +

    '<div style="position:relative;width:265px;height:265px;max-width:100%;max-height:100%"><svg viewBox="0 0 265 265" width="100%" height="100%" aria-hidden="true"><defs><linearGradient id="cg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="'+g1+'"/><stop offset="1" stop-color="'+g2+'"/></linearGradient></defs>' +

let VSTATE = {};

function go(screen, push) {

}
function back() { if (STACK.length) { SCREEN = STACK.pop(); render(); } else if (SCREEN !== 'main') home(); }   // the page's ‹ always leads back to Services (969r)
function mainScreen() { return ST && ST.watching ? 'watching' : 'main'; }
function home() { STACK = []; PANE = 1; SCREEN = 'main'; render(); }

// ── touch: the screen is the only thing that moves around the screen ──
function pager() {
  const pg = $('#pager'); if (!pg) return;
  let sx = 0, sy = 0, dx = 0, mode = '';
  const w = () => pg.parentNode.offsetWidth || 349;
  pg.addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; dx = 0; mode = ''; }, {passive: true});
  pg.addEventListener('touchmove', e => {
    const t = e.touches[0], mx = t.clientX - sx, my = t.clientY - sy;
    if (!mode) { if (Math.abs(mx) > 10 && Math.abs(mx) > Math.abs(my)) mode = 'x'; else if (Math.abs(my) > 10) mode = 'y'; }
    if (mode !== 'x') return;
    dx = mx; if ((PANE === 0 && dx > 0) || (PANE === 2 && dx < 0)) dx = dx / 3;
    pg.classList.add('drag'); pg.style.transform = 'translateX(' + (-PANE * w() + dx) / (w() * 3) * 100 + '%)';
  }, {passive: true});
  pg.addEventListener('touchend', () => {
    if (mode !== 'x') return;
    pg.classList.remove('drag'); BUSYUI = Date.now();
    if (dx < -50 && PANE < 2) PANE++; else if (dx > 50 && PANE > 0) PANE--;
    render();
  });
}
function touchpad() {
  const tp = $('#tp'); if (!tp) return;
  const dot = $('#tdot');
  let sx, sy, moved = false;
  tp.addEventListener('touchstart', e => { if (e.target.closest('button')) return; const t = e.touches[0]; sx = t.clientX; sy = t.clientY; moved = false; if (dot) dot.style.opacity = '1'; }, {passive: true});
  tp.addEventListener('touchend', e => {
    if (dot) dot.style.opacity = '0';
    if (sx == null) return;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy; sx = null;
    if (Math.abs(dx) < 14 && Math.abs(dy) < 14) return key('ok');
    key(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });
}
function dragBar(el, onMove, onDone, onTap) {   // a whole row is the slider: drag sets the level, a tap toggles
  let sx = null, sy = 0, live = false, last = null;
  const pct = x => { const r = el.getBoundingClientRect(); return Math.max(0, Math.min(100, Math.round((x - r.left) / r.width * 100))); };
  el.addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; live = false; }, {passive: true});
  el.addEventListener('touchmove', e => {
    if (sx == null) return; const t = e.touches[0];
    if (!live && Math.abs(t.clientX - sx) > 8 && Math.abs(t.clientX - sx) > Math.abs(t.clientY - sy)) live = true;
    if (live) { last = pct(t.clientX); onMove(last); BUSYUI = Date.now(); }
  }, {passive: true});
  el.addEventListener('touchend', () => { if (sx == null) return; sx = null; BUSYUI = Date.now(); if (live && last != null) onDone(last); else if (onTap) onTap(); });
  el.addEventListener('click', e => { if (N) return; onTap && onTap(); });   // a mouse in a browser, for the installer's look
}
function paint(row, p, suffix) {
  const lv = row.querySelector('.lv'), hn = row.querySelector('.hn'), vv = row.querySelector('.vv');
  if (lv) lv.style.width = p + '%'; if (hn) hn.style.left = p + '%';
  if (vv) { vv.textContent = suffix(p); vv.classList.remove('o'); }
  row.classList.toggle('lit', p >= 30);
}
function sliders() {
  document.querySelectorAll('#app .row[data-light]').forEach(row => {
    const eid = row.dataset.light, kind = row.dataset.kind;
    dragBar(row, p => { if (kind !== 'switch') paint(row, Math.max(1, p), v => v + '%'); },
      p => { if (kind === 'switch') return ctl(eid, p > 50 ? 'on' : 'off'); const l = (ST.lights || []).find(x => x.entity === eid); if (l) { l.on = true; l.brightness = Math.max(1, p); } ctl(eid, 'brightness', Math.max(1, p)); },
      () => { const l = (ST.lights || []).find(x => x.entity === eid); if (l) { l.on = !l.on; if (l.on && !l.brightness) l.brightness = 100; render(); } ctl(eid, 'toggle'); });
  });
  document.querySelectorAll('#app .row[data-cover]').forEach(row => {
    const eid = row.dataset.cover, hasPos = row.dataset.haspos === '1';
    dragBar(row, p => { if (hasPos) paint(row, p, v => v ? v + '%' : 'Closed'); },
      p => { if (hasPos) ctl(eid, 'position', p); else ctl(eid, p > 50 ? 'open' : 'close'); },
      () => { const c = (ST.covers || []).find(x => x.entity === eid); ctl(eid, c && (c.state === 'open' || c.state === 'opening' || (c.position || 0) > 0) ? 'close' : 'open'); });
  });
}
function volSlider(el) {
  const eid = el.dataset.vol;

    p => ctl(eid, 'volume', p), null);

// ── taps ──
document.addEventListener('click', e => {
  const el = e.target.closest('#app [data-go],#app [data-back],#app [data-sc],#app [data-scene],#app [data-act],#app [data-ctl],#app [data-key],#app [data-room],#app [data-mode],#app [data-fan],#app [data-temp],#app [data-alloff],#app [data-closeall],#app [data-climpwr]');
  if (!el || Date.now() - BUSYUI < 250) return;
  wakeBump(); LASTKEY = Date.now();
  const d = el.dataset;
  if (d.go) return go(d.go);
  if (d.back) return back();
  if (d.sc != null) { const s = (ST.shortcuts || [])[+d.sc]; if (!s) return;
    toast('<b>Opening ' + esc(s.name || cap(s.app)) + '…</b>');
    return api('/remote/shortcut', {body: {area: AREA, app: s.app, target: s.target}}).then(after).catch(err => toast(esc(err.message), true)); }
  if (d.scene) return api('/remote/scene', {body: {area: AREA, entity: d.scene}}).then(after).catch(err => toast(esc(err.message), true));
  if (d.act) { toast('<b>Starting…</b>'); return api('/remote/activity', {body: {area: AREA, key: d.act}}).then(r => { after(r); STACK = []; setTimeout(() => refresh(true).then(() => { if (ST && ST.watching) go('watching', false); }), 1500); }).catch(err => toast(esc(err.message), true)); }
  if (d.ctl) { const p = d.ctl.split('|'); return ctl(p[0], p[1]); }
  if (d.key) return key(d.key, false);
  if (d.room) { AREA = d.room; STACK = []; ST = null; PANE = 1; SCREEN = 'main'; render(); return refresh(true).then(() => go(mainScreen(), false)); }
  if (d.mode) { if (ST.climate) { ST.climate.mode = d.mode; render(); } return ctl(ST.climate.entity, 'mode', d.mode); }
  if (d.fan) { if (ST.climate) { ST.climate.fan = d.fan; render(); } return ctl(ST.climate.entity, 'fan', d.fan); }
  if (d.temp) return adjTemp(+d.temp);
  if (d.alloff) { (ST.lights || []).filter(l => l.on).forEach(l => { l.on = false; ctl(l.entity, 'off'); }); return render(); }
  if (d.closeall) return (ST.covers || []).forEach(c => ctl(c.entity, 'close'));
  if (d.climpwr) return ctl(ST.climate.entity, ST.climate.mode === 'off' ? 'on' : 'off');

    (res.hud.level!=null?'<div class="bar" style="height:6px;margin-top:8px"><i style="width:'+res.hud.level+'%"></i></div>':'')+'<div class="t2" style="margin-top:8px">'+esc(shortName(res.hud.name))+'</div>');

    else toast('<b>'+esc((t.area ? t.area + ', ' : '') + t.label)+'</b>');

// A hard key. Core decides what it means in this room right now (remotes.resolve): the D-pad, OK, Back and Menu only
// ever control what's playing — with nothing on they do nothing; they never move around this page (969l).
function key(name, long) {
  LASTKEY = Date.now();
  const k = (ST && ST.keys && ST.keys[name]) ? ST.keys[name][long ? 'long' : 'press'] : null;
  if (k && k.open) {
    if (k.open === 'home') return home();
    if (k.open === 'activities') return;   // no longer offered: Power is TV Off and nothing else (969q)
    if (k.open === 'voice') return startVoice();
    return go(k.open);
  }
  if (k && k.nav) {
    if (k.nav === 'room_next' || k.nav === 'room_prev') return stepRoom(k.nav === 'room_next' ? 1 : -1);
    return;
  }
  if (name === 'home') return home();
  if (name === 'voice') return startVoice();
  if (!k) return;                                   // nothing to do in this room right now
  api('/remote/key', {body: {area: AREA, key: name, long: !!long}}).then(after).catch(e => toast(esc(e.message), true));
}
function ctl(entity, action, value) {

}
let _tT;

  c.target = Math.round((c.target + d * (c.step || 0.5)) * 10) / 10; render();
  clearTimeout(_tT); _tT = setTimeout(() => ctl(c.entity, 'temperature', c.target), 500);
}

  const i = rs.findIndex(r => r.area === AREA); AREA = rs[(i + d + rs.length) % rs.length].area; STACK = []; ST = null; PANE = 1; render();
  refresh(true).then(() => go(mainScreen(), false));

// ── voice: the app records, the home's own speech-to-text hears, ProOS Assist answers for this room ──
function startVoice() {
  VSTATE = {phase: 'listen'}; go('voice');

    .then(r => { VSTATE = {phase: 'done', heard: ev.text, reply: r.reply || 'Done.'}; render(); refresh(true, 600); setTimeout(() => SCREEN === 'voice' && back(), 5000); })
    .catch(e => { VSTATE = {phase: 'done', heard: ev.text, reply: e.message, bad: true}; render(); });

// ── hard keys from the app ──
const CODES = {131:'home',132:'power',133:'voice',134:'light',135:'curtain',136:'music',137:'ac',138:'red',139:'green',140:'blue',141:'yellow',
  19:'up',20:'down',21:'left',22:'right',23:'ok',66:'ok',4:'back',82:'menu',164:'mute',91:'mute',24:'vol_up',25:'vol_down',92:'ch_up',93:'ch_down'};
const HOLD = {power:1, light:1, curtain:1, music:1, ac:1, red:1, green:1, blue:1, yellow:1};   // decided on release: short or long
const REPEAT = {vol_up:1, vol_down:1, up:1, down:1, left:1, right:1};                        // act on press, repeat while held
const down = {};
window.proosKey = function (code, action, repeat) {
  const name = CODES[code]; if (!name) return;

  wakeBump();
  if (SCREEN === 'pair' || SCREEN === 'msg') return;
  if (HOLD[name]) {
    if (action === 'down' && !repeat) { down[name] = {t: Date.now(), fired: false};
      down[name].h = setTimeout(() => { down[name].fired = true; key(name, true); }, 600); }
    else if (action === 'up' && down[name]) { clearTimeout(down[name].h); if (!down[name].fired) key(name, false); delete down[name]; }
    return;
  }
  if (action !== 'down') return;
  if (repeat && !REPEAT[name]) return;
  if (repeat && Date.now() - (down['_' + name] || 0) < 220) return;
  down['_' + name] = Date.now();
  key(name, false);
};
document.addEventListener('keydown', e => {           // a keyboard in a browser, for the installer's look
  const m = {ArrowUp:19, ArrowDown:20, ArrowLeft:21, ArrowRight:22, Enter:23, Escape:4, Backspace:4, h:131, p:132, v:133, '+':24, '-':25};
  if (m[e.key] != null && !N) { e.preventDefault(); window.proosKey(m[e.key], 'down', e.repeat ? 1 : 0); }
  if (!N && (e.key === '[' || e.key === ']') && SCREEN === 'main') { PANE = Math.max(0, Math.min(2, PANE + (e.key === ']' ? 1 : -1))); render(); }
});
document.addEventListener('keyup', e => { const m = {Enter:23, h:131, p:132}; if (m[e.key] != null && !N) window.proosKey(m[e.key], 'up', 0); });

// ── resting: dim when put down, wake on pick-up (the app calls proosWake) ──
let REST_AT = 45000, _restT;
function wakeBump() { clearTimeout(_restT); _restT = setTimeout(rest, REST_AT); }
function rest() { if (['pair','msg','voice'].indexOf(SCREEN) >= 0) return wakeBump(); AWAKE = false; STACK = []; SCREEN = 'rest'; render(); }
function wake() { if (SCREEN === 'rest') { AWAKE = true; PANE = 1; SCREEN = mainScreen(); render(); refresh(true); } wakeBump(); }
window.proosWake = wake;

// ── state ──
let _refT, _busy = false;
function refresh(fresh, delay) {
  clearTimeout(_refT);
  if (delay) { _refT = setTimeout(() => refresh(fresh), delay); return Promise.resolve(); }
  if (!AREA || _busy) return Promise.resolve();
  _busy = true;
  return api('/remote/room/' + encodeURIComponent(AREA) + (fresh ? '?fresh=1' : '')).then(s => {
    const was = ST && ST.activity && ST.activity.key; ST = s;
    const now = s.activity && s.activity.key;
    if (was !== now && (SCREEN === 'main' || SCREEN === 'watching' || SCREEN === 'activities')) { STACK = []; SCREEN = mainScreen(); }
    if (SCREEN === 'watching' && !s.watching) SCREEN = 'main';
    if (Date.now() - LASTKEY > 1500 && Date.now() - BUSYUI > 1200) render();
  }).catch(e => { if (e.status === 401 || e.status === 403) return unpaired(e); }).then(() => { _busy = false; schedule(); });
}
function schedule() { clearTimeout(_refT); _refT = setTimeout(() => refresh(false), AWAKE ? 2500 : 15000); }
function unpaired(e) {
  if (N && N.forgetToken) { try { N.forgetToken(); } catch (x) {} }
  TOKEN = ''; pair();
}
function status() {
  if (!N) return;
  let b = {}; try { b = JSON.parse(nat('battery', '{}')); } catch (e) {}
  const body = {battery: b.level, docked: !!b.charging, rssi: b.rssi, app: nat('version', ''), room: AREA};
  if (AWAKE && SCREEN !== 'pair') { const sh = nat('shot', ''); if (sh && sh.length < 380000) body.shot = sh; }   // Pro's picture of this screen
  api('/remote/status', {body: body}).catch(() => {});
}
function boot() {
  if (!TOKEN) return pair();
  api('/remote/me').then(me => {
    ME = me;
    const rooms = me.rooms_list || [];
    if (!rooms.length) { VSTATE = {title: 'Choose a Room', text: 'This remote is paired. In ProOS Pro, set its Home Room in Dashboards › Remotes.', dots: true}; SCREEN = 'msg'; render(); return setTimeout(boot, 8000); }
    AREA = rooms.some(r => r.area === me.home_room) ? me.home_room : rooms[0].area;
    PANE = 1; SCREEN = 'main'; render(); refresh(true); wakeBump(); setTimeout(status, 2500); setInterval(status, 30000);
    setInterval(() => api('/remote/me').then(m => { ME = m; if (!(m.rooms_list || []).some(r => r.area === AREA)) boot(); }).catch(() => {}), 30000);
  }).catch(e => { if (e.status === 401 || e.status === 403) return unpaired(e); VSTATE = {title: 'Can\'t Reach Your Home', text: 'Checking again…', dots: true}; SCREEN = 'msg'; render(); setTimeout(boot, 5000); });
}
// ── pairing: say hello, show the code, wait for the installer to accept in Pro ──
function pair() {
  SCREEN = 'pair'; VSTATE = {msg: 'Finding your home…'}; render();
  if (!N || !N.serial) { VSTATE = {msg: 'Open this page on a ProOS Remote, or sign in to Pro in this browser first.'}; return render(); }
  const nonce = nat('nonce', '');
  const tick = () => fetch('/remote/hello?serial=' + encodeURIComponent(SERIAL) + '&model=' + encodeURIComponent(nat('model', 'HA100')) + '&nonce=' + encodeURIComponent(nonce) + '&app=' + encodeURIComponent(nat('version', '')), {cache: 'no-store'})
    .then(r => r.json()).then(j => {
      if (j.accepted && j.token) { try { N.saveToken(j.token); } catch (e) {} TOKEN = j.token; return boot(); }
      VSTATE = {code: j.code}; render(); setTimeout(tick, 3000);
    }).catch(() => { VSTATE = {msg: 'Can\'t reach your home yet — checking again…'}; render(); setTimeout(tick, 5000); });
  tick();
}
setInterval(() => { if (SCREEN === 'rest' || ((SCREEN === 'watching' || SCREEN === 'music' || SCREEN === 'main') && Date.now() - LASTKEY > 1500 && Date.now() - BUSYUI > 1200)) render(); }, 30000);
boot();
</script>
