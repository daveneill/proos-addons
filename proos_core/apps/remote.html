<title>ProOS Remote</title>

  ProOS Remote app on the Sanytron Astrion HA100A (480×800, density 220 → 349×582 CSS px). Approved design:
  docs/mockups/ProOS_Remote_Mockups_v2_2026-10-20.html. A LIGHT page on purpose: the full dashboard never finished
  loading on this remote (register 969g). Every hard key is decided by Core from the room's live activity

<style>
:root{color-scheme:dark;--ink:#fff;--ink2:rgba(255,255,255,.66);--ink3:rgba(255,255,255,.40);--glass:rgba(24,24,30,.52);

--ease:cubic-bezier(.2,.8,.2,1);--f:'Inter',-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:var(--ink);font-family:var(--f);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
#ph{position:fixed;inset:-24px;background:#000 center/cover;z-index:-2;filter:blur(18px) brightness(.5) saturate(1.2);transform:scale(1.05);transition:filter .6s,opacity .6s}
#ph.sharp{inset:0;filter:none;transform:none}
#sh{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,rgba(0,0,0,.35) 38%,rgba(0,0,0,.86) 72%,#000 100%)}
#app{height:100%;display:flex;flex-direction:column}
.sb{display:flex;align-items:center;gap:6px;padding:10px 15px 0;font-size:11.5px;font-weight:500;color:rgba(255,255,255,.8)}
.sb .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.bat{width:21px;height:10px;border:1.4px solid rgba(255,255,255,.6);border-radius:3px;position:relative}.bat i{position:absolute;left:1.5px;top:1.5px;bottom:1.5px;background:#fff;border-radius:1px}
.hero{padding:0 16px}.eb{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.big{font-size:32px;font-weight:300;letter-spacing:-.03em;line-height:1.05;margin-top:2px}
.g{background:var(--glass);border:1px solid var(--hair);border-radius:18px;backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.ttl{font-size:14.5px;font-weight:600;line-height:1.2}.sub{font-size:11.5px;color:var(--ink2);margin-top:2px;line-height:1.3}.sub b{color:#fff;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.bt{display:inline-grid;place-items:center;font-weight:800;letter-spacing:-.02em;position:relative;overflow:hidden;flex:none;box-shadow:0 6px 16px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.1)}
.bt::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.4) 50%,transparent 65%);transform:translateX(-130%);animation:sheen 5s ease-in-out infinite}
@keyframes sheen{0%,60%{transform:translateX(-130%)}85%,100%{transform:translateX(130%)}}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:11px;margin-right:3px}.eq i{width:2.5px;background:var(--mint);border-radius:1px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.35s}.eq i:nth-child(3){animation-delay:-.7s}.eq i:nth-child(4){animation-delay:-.2s}@keyframes eq{0%,100%{height:3px}50%{height:11px}}
.pw{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.1);color:#fff}
.pw.on{background:linear-gradient(180deg,#FFD08A,#F0A048);color:#3a1d00;box-shadow:0 0 0 4px rgba(255,196,107,.16),0 0 22px rgba(255,180,90,.55)}
.cring{width:34px;height:34px;border-radius:50%;flex:none;padding:3px;background:conic-gradient(#ff5e5e,#ffd36e,#7cf0a0,#6ec8ff,#b58cff,#ff5ec8,#ff5e5e)}.cring i{display:block;width:100%;height:100%;border-radius:50%;border:2px solid #111}
.brt{height:38px;border-radius:12px;background:rgba(255,255,255,.1);position:relative;overflow:hidden;display:flex;align-items:center;padding:0 12px;font-size:12.5px;font-weight:600;gap:8px;margin-top:9px}
.brt i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--amber2),var(--amber));z-index:0;transition:width .4s var(--ease)}
.brt>*{position:relative;z-index:1}.brt .v{margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:10px;background:rgba(255,255,255,.09);font-size:12px;font-weight:600;white-space:nowrap}
.chip.on{background:#fff;color:#000}
.f{outline:2px solid #fff;outline-offset:2px;animation:foc 2.2s ease-in-out infinite}@keyframes foc{50%{outline-color:rgba(255,255,255,.45);outline-offset:4px}}
.legend{display:flex;gap:6px;justify-content:center;padding:10px 12px 12px;margin-top:auto;flex-wrap:wrap}
.lk{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px 0 4px;border-radius:8px;background:rgba(255,255,255,.08);font-size:10.5px;font-weight:600;color:rgba(255,255,255,.85)}
.lk .k{min-width:16px;height:16px;border-radius:5px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:9px;padding:0 3px}
.cb{width:14px;height:3px;border-radius:2px;display:inline-block}
.chain{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--ink2);margin-top:7px;flex-wrap:wrap}.chain span{padding:3px 7px;border-radius:7px;background:rgba(255,255,255,.08)}
.chain i{width:12px;height:2px;background:linear-gradient(90deg,transparent,var(--mint),transparent);background-size:200% 100%;animation:pulse 1.5s linear infinite}@keyframes pulse{to{background-position:-200% 0}}
.prog{height:4px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}.prog i{display:block;height:100%;background:#fff;border-radius:2px}
.scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.hud{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.94);z-index:9;width:200px;padding:18px 16px;border-radius:24px;text-align:center;background:rgba(18,18,22,.82);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--hair);opacity:0;pointer-events:none;transition:opacity .25s,transform .35s var(--ease)}
.hud.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#dim{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s}#dim.on{opacity:1}
.toast{position:fixed;left:12px;right:12px;bottom:46px;z-index:7;padding:12px;display:flex;align-items:center;gap:11px;transform:translateY(20px);opacity:0;transition:all .4s var(--ease)}
.toast.on{transform:none;opacity:1}
.okc{width:28px;height:28px;border-radius:50%;background:var(--ok);display:grid;place-items:center;color:#032;flex:none;box-shadow:0 0 18px rgba(50,215,75,.6);font-weight:800}
.okc.bad{background:var(--amber);box-shadow:0 0 18px rgba(255,180,90,.6)}
.slats{position:absolute;left:0;right:0;top:0;background:repeating-linear-gradient(180deg,#2a2e35 0 6px,#3a3f48 6px 8px);box-shadow:0 2px 6px rgba(0,0,0,.5);transition:height 1.2s var(--ease)}
.spin{animation:spin 1.6s linear infinite;display:inline-grid}@keyframes spin{to{transform:rotate(360deg)}}
.orb{width:132px;height:132px;border-radius:50%;position:relative;background:radial-gradient(circle at 38% 32%,#b9c4ff,#5b6cff 40%,#2139F0 62%,#0a1680);box-shadow:0 0 60px rgba(60,90,255,.6)}
.orb::before,.orb::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px solid rgba(120,140,255,.45);animation:wave 2s ease-out infinite}.orb::after{animation-delay:1s}
@keyframes wave{from{transform:scale(.9);opacity:.9}to{transform:scale(1.5);opacity:0}}
.orb.think{animation:breathe 1.2s ease-in-out infinite}@keyframes breathe{50%{transform:scale(.92)}}
.dial{position:relative;width:206px;height:206px;margin:10px auto 0}.dial svg{position:absolute;inset:0;width:100%;height:100%}
.dial .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dots{display:inline-flex;gap:5px}.dots i{width:7px;height:7px;border-radius:50%;background:#5b8cff;animation:dt 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dt{0%,100%{opacity:.25}50%{opacity:1}}
.tp{margin:10px 14px 0;height:96px;border-radius:18px;position:relative;overflow:hidden;display:grid;place-items:center;touch-action:none}

}
function back() { if (STACK.length) { SCREEN = STACK.pop(); FI = 0; render(); } else if (SCREEN !== mainScreen()) go(mainScreen(), false); }
function mainScreen() { return ST && ST.activity && ST.activity.kind !== 'music' ? 'watching' : 'home'; }

// ── doing things ──
function toast(text, bad) {
  const t = $('#toast'); t.innerHTML = '<span class="okc'+(bad?' bad':'')+'">'+(bad?'!':'✓')+'</span><span style="font-size:13px">'+text+'</span>';
  t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 3200);
}
function hud(html) {
  const h = $('#hud'); h.innerHTML = html; h.classList.add('on'); $('#dim').classList.add('on');
  clearTimeout(h._h); h._h = setTimeout(() => { h.classList.remove('on'); $('#dim').classList.remove('on'); }, 1600);
}
function after(res) {
  if (!res) return;
  if (res.hud && res.hud.kind === 'volume') hud('<div style="display:flex;justify-content:center">'+ic(res.hud.muted?'mute':'vol',26)+'</div><div class="num" style="font-size:48px;font-weight:200;letter-spacing:-2px;margin-top:4px">'+(res.hud.muted?'Muted':(res.hud.level!=null?res.hud.level:'—'))+'</div>' +
    (res.hud.level!=null?'<div class="prog" style="height:6px;margin-top:8px"><i style="width:'+res.hud.level+'%"></i></div>':'')+'<div class="sub" style="margin-top:8px">'+esc(res.hud.name)+' · Volume</div>');
  if (res.toast) {
    const t = res.toast;
    if (t.kind === 'scene') hud('<div style="width:62px;height:62px;border-radius:20px;margin:0 auto;display:grid;place-items:center;background:linear-gradient(180deg,#4b3a8f,#22184f);color:#e9ddff;box-shadow:0 0 30px rgba(120,90,255,.5)">'+ic('scene',28)+'</div><div style="font-size:19px;font-weight:600;margin-top:10px">'+esc(t.label)+'</div>');
    else toast('<b>'+esc((t.area ? t.area + ', ' : '') + t.label)+'.</b>');
  }
  if (res.error) toast(esc(res.error), true);
  refresh(true, 700);
}
function key(name, long) {
  LASTKEY = Date.now();
  const k = (ST && ST.keys && ST.keys[name]) ? ST.keys[name][long ? 'long' : 'press'] : null;
  // screens with their own controls take the D-pad and OK; the watching screen hands them to the source (Core)
  const local = SCREEN !== 'watching' && SCREEN !== 'home';
  if (['up','down','left','right','ok','back'].indexOf(name) >= 0 && (local || SCREEN === 'home' || !k || !k.core)) {
    if (SCREEN === 'home' && name === 'back') return;
    return localKey(name);
  }
  if (k && k.open) {
    if (k.open === 'home') return go(SCREEN === 'home' && ST.activity && ST.activity.kind !== 'music' ? 'watching' : 'home', false);
    if (k.open === 'activities') return go('home', false);
    if (k.open === 'voice') return startVoice();
    return go(k.open);
  }
  if (k && k.nav) {
    if (k.nav === 'room_next' || k.nav === 'room_prev') return stepRoom(k.nav === 'room_next' ? 1 : -1);
    return localKey(k.nav);
  }
  if (name === 'home') return go(mainScreen(), false);
  if (name === 'voice') return startVoice();
  if (!k) return;                                   // nothing to do in this room right now
  api('/remote/key', {body: {area: AREA, key: name, long: !!long}}).then(after).catch(e => toast(esc(e.message), true));
}
function localKey(name) {
  if (name === 'back') return back();
  if (['up','down','left','right'].indexOf(name) >= 0) {
    const el = focusables()[FI];
    if (el && (name === 'left' || name === 'right')) {
      if (el.dataset.light) return adjLight(el.dataset.light, name === 'right' ? 10 : -10);
      if (el.dataset.cover) return ctl(el.dataset.cover, name === 'right' ? 'open' : 'close');
      if (SCREEN === 'climate' && ST.climate) return adjTemp(name === 'right' ? 1 : -1);
      if (SCREEN === 'music' && ST.music && !el.dataset.ctl) return ctl(ST.music.entity, name === 'right' ? 'next' : 'prev');
    }
    return move(name);
  }
  if (name === 'ok') { const el = focusables()[FI]; if (el) activate(el); }
}
function activate(el) {
  if (el.dataset.go) return go(el.dataset.go);
  if (el.dataset.act) return api('/remote/activity', {body: {area: AREA, key: el.dataset.act}}).then(r => { after(r); setTimeout(() => go(mainScreen(), false), 900); }).catch(e => toast(esc(e.message), true));
  if (el.dataset.light) return ctl(el.dataset.light, 'toggle');
  if (el.dataset.cover) return ctl(el.dataset.cover, 'stop');
  if (el.dataset.mode) return ctl(ST.climate.entity, 'mode', el.dataset.mode);
  if (el.dataset.ctl) { const p = el.dataset.ctl.split('|'); return ctl(p[0], p[1]); }
  if (el.dataset.room) { AREA = el.dataset.room; STACK = []; ST = null; render(); return refresh(true).then(() => go(mainScreen(), false)); }
}
function ctl(entity, action, value) {
  return api('/remote/control', {body: {area: AREA, entity: entity, action: action, value: value}}).then(after).catch(e => toast(esc(e.message), true));
}
let _dimT = {};
function adjLight(eid, d) {
  const l = (ST.lights || []).find(x => x.entity === eid); if (!l || l.kind === 'switch') return;
  l.brightness = Math.max(1, Math.min(100, (l.on ? (l.brightness || 0) : 0) + d)); l.on = true; render();
  clearTimeout(_dimT[eid]); _dimT[eid] = setTimeout(() => ctl(eid, 'brightness', l.brightness), 350);
}
let _tT;
function adjTemp(d) {
  const c = ST.climate; if (c.target == null) return;
  c.target = Math.round((c.target + d * (c.step || 0.5)) * 10) / 10; render();
  clearTimeout(_tT); _tT = setTimeout(() => ctl(c.entity, 'temperature', c.target), 500);
}
function stepRoom(d) {
  const rs = (ME && ME.rooms_list) || []; if (rs.length < 2) return;
  const i = rs.findIndex(r => r.area === AREA); AREA = rs[(i + d + rs.length) % rs.length].area; STACK = []; ST = null; render();
  refresh(true).then(() => go(mainScreen(), false));
}
function touchpad() {
  const tp = $('#tp'); if (!tp) return;
  let sx, sy, st;
  tp.addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); }, {passive: true});
  tp.addEventListener('touchend', e => { const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) < 14 && Math.abs(dy) < 14) return key('ok');
    key(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up')); });
}

// ── voice: the app records, the home's own speech-to-text hears, ProOS Assist answers for this room ──
function startVoice() {
  VSTATE = {phase: 'listen'}; go('voice');
  if (!N || !N.startVoice) { VSTATE = {phase: 'done', reply: 'Voice works on the remote itself.', bad: true}; return render(); }
  try { N.startVoice(); } catch (e) {}
}
window.proosVoice = function (ev) {
  if (SCREEN !== 'voice') return;
  if (ev.phase === 'think') { VSTATE.phase = 'think'; return render(); }
  if (ev.error) { VSTATE = {phase: 'done', reply: ev.error, bad: true}; render(); return setTimeout(() => SCREEN === 'voice' && back(), 4000); }
  VSTATE = {phase: 'think', heard: ev.text}; render();
  api('/assist/chat', {body: {text: ev.text, area_id: AREA, area_confidence: 'certain', session: 'remote-' + (SERIAL || 'browser')}})
    .then(r => { VSTATE = {phase: 'done', heard: ev.text, reply: r.reply || 'Done.'}; render(); refresh(true, 600); setTimeout(() => SCREEN === 'voice' && back(), 5000); })
    .catch(e => { VSTATE = {phase: 'done', heard: ev.text, reply: e.message, bad: true}; render(); });
};

// ── hard keys from the app ──
const CODES = {131:'home',132:'power',133:'voice',134:'light',135:'curtain',136:'music',137:'ac',138:'red',139:'green',140:'blue',141:'yellow',
  19:'up',20:'down',21:'left',22:'right',23:'ok',66:'ok',4:'back',82:'menu',164:'mute',91:'mute',24:'vol_up',25:'vol_down',92:'ch_up',93:'ch_down'};
const HOLD = {power:1, light:1, curtain:1, music:1, ac:1, red:1, green:1, blue:1, yellow:1};   // decided on release: short or long
const REPEAT = {vol_up:1, vol_down:1, up:1, down:1, left:1, right:1};                        // act on press, repeat while held
const down = {};
window.proosKey = function (code, action, repeat) {
  const name = CODES[code]; if (!name) return;
  if (SCREEN === 'rest') { if (action === 'up') wake(); return; }
  wakeBump();
  if (SCREEN === 'pair' || SCREEN === 'msg') return;
  if (HOLD[name]) {
    if (action === 'down' && !repeat) { down[name] = {t: Date.now(), fired: false};
      down[name].h = setTimeout(() => { down[name].fired = true; key(name, true); }, 600); }
    else if (action === 'up' && down[name]) { clearTimeout(down[name].h); if (!down[name].fired) key(name, false); delete down[name]; }
    return;
  }
  if (action !== 'down') return;
  if (repeat && !REPEAT[name]) return;
  if (repeat && Date.now() - (down['_' + name] || 0) < 220) return;
  down['_' + name] = Date.now();
  key(name, false);
};
document.addEventListener('keydown', e => {           // a keyboard in a browser, for the installer's look
  const m = {ArrowUp:19, ArrowDown:20, ArrowLeft:21, ArrowRight:22, Enter:23, Escape:4, Backspace:4, h:131, p:132, v:133, '+':24, '-':25};
  if (m[e.key] != null && !N) { e.preventDefault(); window.proosKey(m[e.key], 'down', e.repeat ? 1 : 0); }
});
document.addEventListener('keyup', e => { const m = {Enter:23, h:131, p:132}; if (m[e.key] != null && !N) window.proosKey(m[e.key], 'up', 0); });

// ── resting: dim when put down, wake on pick-up (the app calls proosWake) ──
let REST_AT = 45000, _restT;
function wakeBump() { clearTimeout(_restT); _restT = setTimeout(rest, REST_AT); }
function rest() { if (['pair','msg','voice'].indexOf(SCREEN) >= 0) return wakeBump(); AWAKE = false; STACK = []; SCREEN = 'rest'; render(); }
function wake() { if (SCREEN === 'rest') { AWAKE = true; SCREEN = mainScreen(); FI = 0; render(); refresh(true); } wakeBump(); }
window.proosWake = wake;

// ── state ──
let _refT, _busy = false;
function refresh(fresh, delay) {
  clearTimeout(_refT);
  if (delay) { _refT = setTimeout(() => refresh(fresh), delay); return Promise.resolve(); }
  if (!AREA || _busy) return Promise.resolve();
  _busy = true;
  return api('/remote/room/' + encodeURIComponent(AREA) + (fresh ? '?fresh=1' : '')).then(s => {
    const was = ST && ST.activity && ST.activity.key; ST = s; LASTSTATE = Date.now();
    const now = s.activity && s.activity.key;
    if (was !== now && (SCREEN === 'home' || SCREEN === 'watching')) { SCREEN = mainScreen(); FI = 0; }
    if (Date.now() - LASTKEY > 1500 || !document.querySelector('#app .f')) render();
  }).catch(e => { if (e.status === 401 || e.status === 403) return unpaired(e); }).then(() => { _busy = false; schedule(); });
}
function schedule() { clearTimeout(_refT); _refT = setTimeout(() => refresh(false), AWAKE ? 2500 : 15000); }
function unpaired(e) {
  if (N && N.forgetToken) { try { N.forgetToken(); } catch (x) {} }
  TOKEN = ''; pair();
}
function status() {
  if (!N) return;
  let b = {}; try { b = JSON.parse(nat('battery', '{}')); } catch (e) {}
  const body = {battery: b.level, docked: !!b.charging, rssi: b.rssi, app: nat('version', ''), room: AREA};
  if (AWAKE && SCREEN !== 'pair') { const sh = nat('shot', ''); if (sh && sh.length < 380000) body.shot = sh; }   // Pro's picture of this screen
  api('/remote/status', {body: body}).catch(() => {});
}
function boot() {
  if (!TOKEN) return pair();
  api('/remote/me').then(me => {
    ME = me;
    const rooms = me.rooms_list || [];
    if (!rooms.length) { VSTATE = {title: 'Choose a Room', text: 'This remote is paired. In ProOS Pro, set its Home Room in Dashboards › Remotes.', dots: true}; SCREEN = 'msg'; render(); return setTimeout(boot, 8000); }
    AREA = rooms.some(r => r.area === me.home_room) ? me.home_room : rooms[0].area;
    SCREEN = 'home'; render(); refresh(true); wakeBump(); setTimeout(status, 2500); setInterval(status, 30000);
    setInterval(() => api('/remote/me').then(m => { ME = m; if (!(m.rooms_list || []).some(r => r.area === AREA)) boot(); }).catch(() => {}), 30000);
  }).catch(e => { if (e.status === 401 || e.status === 403) return unpaired(e); VSTATE = {title: 'Can\'t Reach Your Home', text: 'Checking again…', dots: true}; SCREEN = 'msg'; render(); setTimeout(boot, 5000); });
}
// ── pairing: say hello, show the code, wait for the installer to accept in Pro ──
function pair() {
  SCREEN = 'pair'; VSTATE = {msg: 'Finding your home…'}; render();
  if (!N || !N.serial) { VSTATE = {msg: 'Open this page on a ProOS Remote, or sign in to Pro in this browser first.'}; return render(); }
  const nonce = nat('nonce', '');
  const tick = () => fetch('/remote/hello?serial=' + encodeURIComponent(SERIAL) + '&model=' + encodeURIComponent(nat('model', 'HA100')) + '&nonce=' + encodeURIComponent(nonce) + '&app=' + encodeURIComponent(nat('version', '')), {cache: 'no-store'})
    .then(r => r.json()).then(j => {
      if (j.accepted && j.token) { try { N.saveToken(j.token); } catch (e) {} TOKEN = j.token; return boot(); }
      VSTATE = {code: j.code}; render(); setTimeout(tick, 3000);
    }).catch(() => { VSTATE = {msg: 'Can\'t reach your home yet — checking again…'}; render(); setTimeout(tick, 5000); });
  tick();
}
setInterval(() => { if (SCREEN === 'rest' || ((SCREEN === 'watching' || SCREEN === 'music') && Date.now() - LASTKEY > 1500)) render(); }, 30000);
boot();
</script>
