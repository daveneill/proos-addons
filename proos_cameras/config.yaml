name: ProOS Cameras
version: "0.3.1"
slug: proos_cameras
description: >-
  Puts this home's UniFi Protect cameras into Apple Home as their own accessories, published by ProOS — live view,
  snapshots, motion, and the doorbell with its ring and two-way talk; cameras listed under secure_video are published
  as Apple's new Secure Video cameras (recording to iCloud, People / Vehicles / Animals / Packages) — experimental.
  Cameras are chosen in ProOS Pro (Apple Home); nothing is set here.
url: https://github.com/daveneill/proos-addons/tree/main/proos_cameras
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
host_network: true
homeassistant_api: true
map:
  - homeassistant_config:ro
options:
  cameras: []
  log_level: info
schema:
  cameras:
    - str
  secure_video:
    - str?
  log_level: list(debug|info|warning|error)
stage: experimental
